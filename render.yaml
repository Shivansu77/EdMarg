services:
  # Backend Service
  - type: web
    name: edmarg-backend
    runtime: node
    env: node
    buildCommand: cd backend && npm install && npm run build
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_ORIGIN
        value: https://www.edmarg.com,https://edmarg.onrender.com
      - key: FRONTEND_ORIGINS
        value: https://www.edmarg.com,https://edmarg.com,https://edmarg.onrender.com
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: LOG_LEVEL
        value: info
    # Render probes this route to decide whether the instance is live. It is
    # registered before the database middleware, so it answers during a cold
    # start instead of waiting on MongoDB.
    healthCheckPath: /api/v1/health
    # NOTE ON HIBERNATION
    # On the free tier Render suspends an idle instance after ~15 minutes. The
    # first request afterwards is rejected at the edge with a header-less 503
    # (`x-render-routing: hibernate-wake-error`), which browsers surface as a
    # CORS error — this is what broke recording uploads.
    #
    # Two defences are in place:
    #   1. The server self-pings /api/v1/health every 10 minutes (see server.ts),
    #      which keeps the instance resident on the current plan.
    #   2. The frontend wakes the backend and retries transient failures, so a
    #      cold start degrades into a short wait rather than a lost upload.
    #
    # For a hard guarantee, move to a paid instance type, which never hibernates:
    #   plan: starter


  # Frontend Service
  - type: web
    name: edmarg-frontend
    runtime: node
    env: node
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://edmarg.onrender.com/api/v1
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://edmarg.onrender.com/api/v1
      - key: NEXT_PUBLIC_BACKEND_URL
        value: https://edmarg.onrender.com
      - key: NEXT_PUBLIC_BASE_URL
        value: https://edmarg.onrender.com
      - key: NEXT_PUBLIC_APP_NAME
        value: EdMarg
      - key: NEXT_PUBLIC_APP_URL
        value: https://edmarg.onrender.com
      - key: NEXT_PUBLIC_ENVIRONMENT
        value: production
      - key: NODE_ENV
        value: production
